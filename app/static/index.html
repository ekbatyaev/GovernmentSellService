<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<title>Закупки</title>

<link rel="stylesheet" href="static/style.css">

</head>

<body>

<div class="layout">

<!-- ФИЛЬТРЫ -->

<div class="sidebar">

<h2>Фильтры</h2>

<label>Название</label>
<input id="name" placeholder="Введите название">

<label>Сумма от</label>
<input id="initial_sum_from" type="number">

<label>Сумма до</label>
<input id="initial_sum_to" type="number">

<label>Публикация от</label>
<input id="publication_datetime_from" type="datetime-local">

<label>Публикация до</label>
<input id="publication_datetime_to" type="datetime-local">

<label>Подача заявок от</label>
<input id="submission_close_datetime_from" type="datetime-local">

<label>Подача заявок до</label>
<input id="submission_close_datetime_to" type="datetime-local">

<label>Источник</label>
<input id="source_file">

<button onclick="search()">Поиск</button>

</div>

<!-- ОСНОВНОЙ БЛОК -->

<div class="main">

<div class="topbar">

<h1>Госзакупки</h1>

<div class="controls">

<select id="sort" onchange="applySort()">
<option value="none">Без сортировки</option>
<option value="sum_desc">Сумма ↓</option>
<option value="sum_asc">Сумма ↑</option>
</select>

<div id="count"></div>

</div>

</div>

<div id="cards" class="cards"></div>

</div>

</div>

<script src="static/script.js"></script>

</body>
</html>
